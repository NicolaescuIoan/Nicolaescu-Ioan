<!DOCTYPE html>
<title>Ioan Nicolaescu — CV | Antene, Radar și Comunicații Radio</title>

<meta property="og:title" content="Ioan Nicolaescu — CV">
<meta property="og:description" content="Professor, cercetător în antene, radar și comunicații radio la Academia Tehnică Militară din București.">

<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ioan Nicolaescu — CV</title>
     
     <img src="img/Nicolaescu-ioan.jpg" 
     srcset="img/Nicolaescu-ioan.jpg 1x, img/Nicolaescu-ioan@2x.jpg 2x"
     alt="Ioan Nicolaescu" 
     width="120" height="160" 
     style="border-radius:4px; margin-bottom:1rem;">
<style>
  :root{
    --ink:#1c1b19;
    --paper:#faf7f2;
    --line:#e4ddd0;
    --accent:#3a5a40;
    --muted:#6b6459;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
    line-height:1.6;
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 24px;}

  header{padding:56px 0 32px; border-bottom:1px solid var(--line);}
  .eyebrow{
    font-family:'Courier New', monospace;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:12px;
    color:var(--accent);
    margin-bottom:14px;
  }
  h1{font-size:clamp(2rem, 5vw, 3rem); font-weight:400;}

  nav{
    position:sticky; top:0;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    z-index:10;
  }
  nav .wrap{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding-top:12px;
    padding-bottom:0;
  }
  nav button{
    font-family:'Courier New', monospace;
    font-size:13px;
    letter-spacing:0.03em;
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    padding:10px 14px 12px;
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
  }
  nav button:hover{color:var(--ink);}
  nav button.active{
    color:var(--ink);
    border-bottom-color:var(--accent);
  }

  main{padding:48px 0 80px; min-height:40vh;}
  #content h2{font-size:1.6rem; font-weight:400; margin-bottom:24px;}
  #content{max-width:70ch;}
  #content p{margin-bottom:14px;}
  #content ul{margin:0 0 14px 20px;}
  #content .entry{margin-bottom:22px;}
  #content .entry .meta{font-size:0.85rem; color:var(--muted); font-family:'Courier New', monospace;}
  #content .loading{color:var(--muted); font-style:italic;}

  footer{
    padding:32px 0 48px;
    font-size:0.85rem;
    color:var(--muted);
    text-align:center;
    border-top:1px solid var(--line);
  }
</style>
</head>
<body>

<header class="wrap">
  <div class="eyebrow">Curriculum Vitae</div>
  <h1>Ioan Nicolaescu</h1>
</header>

<nav>
  <div class="wrap" id="tabs">
    <button data-section="intro" class="active">Intro</button>
    <button data-section="education">Education</button>
    <button data-section="jobs">Jobs</button>
    <button data-section="projects">Projects</button>
    <button data-section="publications">Publications</button>
    <button data-section="courses">Courses</button>
    <button data-section="phd-students">PhD students</button>
    <button data-section="achievements">Best achievements</button>
  </div>
</nav>

<main class="wrap">
  <div id="content">
    <p class="loading">Loading…</p>
  </div>
</main>

<footer class="wrap">
  © 2026 Ioan Nicolaescu
</footer>

<script>
  const tabs = document.querySelectorAll('#tabs button');
  const content = document.getElementById('content');

  async function loadSection(name){
    content.innerHTML = '<p class="loading">Loading…</p>';
    try{
      const res = await fetch(`sections/${name}.html`);
      if(!res.ok) throw new Error('not found');
      const html = await res.text();
      content.innerHTML = html;
    }catch(e){
      content.innerHTML = `<p class="loading">Content for this section hasn't been added yet. Create the file <code>sections/${name}.html</code>.</p>`;
    }
  }

  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadSection(btn.dataset.section);
      history.replaceState(null, '', '#' + btn.dataset.section);
    });
  });

  // load section from URL hash on first load, otherwise default to intro
  const initial = location.hash ? location.hash.slice(1) : 'intro';
  const initialBtn = [...tabs].find(b => b.dataset.section === initial) || tabs[0];
  tabs.forEach(b => b.classList.remove('active'));
  initialBtn.classList.add('active');
  loadSection(initialBtn.dataset.section);
</script>

</body>
</html>
